name: scorecard

# Sprint 6 — the quality gate runs on every push/PR. These suites are all
# offline (no DB, no API keys), so CI needs no secrets. A red scorecard
# blocks merge.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  scorecard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal test deps
        run: |
          python -m pip install --upgrade pip
          pip install rapidfuzz
      - name: Run scorecard (offline quality gate)
        run: python scripts/scorecard.py --json scorecard_report.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-report
          path: scorecard_report.json
